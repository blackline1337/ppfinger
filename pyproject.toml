[project]
name = "ppfngr"
version = "2.0.0"
description = "WAF/CDN fingerprinter + sqlmap tamper advisor + PHP/ASP(X) form finder (async, RAM-conscious concurrency)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.9.0",
    "aiohttp-socks>=0.9.0",
    "beautifulsoup4>=4.12.0",
    "colorama>=0.4.6",
    "cryptography>=42.0.0",
    "pyfiglet>=1.0.2",
    "psutil>=5.9.0",
]

[project.scripts]
ppfngr = "ppfinger:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["ppfinger.py"]
