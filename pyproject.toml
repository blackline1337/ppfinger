[project]
name = "ppfngr"
version = "1.0.0"
description = "WAF/CDN fingerprinter + sqlmap tamper advisor + PHP/ASP(X) form finder"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "colorama>=0.4.6",
    "cryptography>=42.0.0",
    "PySocks>=1.7.1",
    "pyfiglet>=1.0.2",
]

[project.scripts]
ppfngr = "ppfinger:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["ppfinger.py"]
